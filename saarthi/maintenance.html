<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saarthi · Temporarily unavailable</title>
<link rel="stylesheet" href="css/style.css?v=5.0">
</head>
<body>
<script>document.documentElement.dataset.theme=localStorage.getItem("saarthi_theme_v2")||"light";</script>
<div style="min-height:100vh;display:grid;place-items:center;background:var(--paper);padding:2rem">
  <div style="max-width:440px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2.4rem 2rem;box-shadow:var(--shadow-lg)">
    <img src="assets/saarthi-logo.png" alt="SAARTHII" style="height:44px;width:auto;margin-bottom:1.2rem">
    <div style="font-size:2.8rem">🛠️</div>
    <h2 style="font-size:1.35rem;font-weight:800;color:var(--navy);margin:.9rem 0 .5rem">Saarthi is temporarily unavailable</h2>
    <p id="msg" style="color:var(--muted);font-size:.9rem;line-height:1.6">The portal is undergoing scheduled maintenance. Please check back shortly.</p>
    <p id="reopenAt" style="color:var(--muted);font-size:.78rem;margin-top:.9rem"></p>
    <a href="login.html?role=admin" style="display:inline-block;margin-top:1.4rem;font-size:.76rem;color:var(--muted);text-decoration:underline">Administration sign in</a>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
// If maintenance has since been turned off (or its auto-reopen time has passed),
// bounce straight back to the portal instead of showing a stale "unavailable" page.
if (!maintenanceActive()) location.replace('index.html');
const m = getMaintenance();
if (m.message) document.getElementById('msg').textContent = m.message;
if (m.reopenAt) document.getElementById('reopenAt').textContent =
  'Expected back online: ' + new Date(m.reopenAt).toLocaleString('en-IN', { dateStyle:'medium', timeStyle:'short' });
// Recheck periodically so the page updates itself the moment the scheduled reopen time arrives
setInterval(() => { if (!maintenanceActive()) location.replace('index.html'); }, 15000);
</script>
</body>
</html>
