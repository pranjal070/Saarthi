<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password · Saarthi</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/icons.css">
<link rel="stylesheet" href="css/compat.css">
</head>
<body>
<script>document.documentElement.dataset.theme=localStorage.getItem("saarthi_theme_v3")||"light";</script>

<div style="min-height:100vh;display:grid;place-items:center;padding:1rem">
<div class="glass" style="width:100%;max-width:420px;padding:1.6rem;border-radius:16px">
  <a href="index.html" class="brand-logo" style="display:inline-block;margin-bottom:1rem" aria-label="Saarthi home"><div class="logo-txt"><span class="l-or">SAA</span><span class="l-bl">R</span><span class="l-or">T</span><span class="l-gr">HII</span></div><div class="logo-lines"><span class="line-or"></span><span class="dot-bl"></span><span class="line-gr"></span></div></a>
  <h2 style="margin:.2rem 0 .8rem">Forgot password</h2>
  <p style="font-size:.88rem;color:var(--muted)">Enter the mobile number and email you registered with. We will email you a link to choose a new password.</p>
  <form id="f" novalidate>
    <div class="field"><label>Mobile number</label><input name="phone" maxlength="10" inputmode="numeric" placeholder="10-digit mobile"></div>
    <div class="field"><label>Registered email</label><input name="email" type="email" placeholder="you@gmail.com"></div>
    <button class="btn btn-pine btn-block">Email me the reset link</button>
    <div id="msg" style="margin-top:.8rem;font-size:.88rem"></div>
  </form>
  <p style="font-size:.83rem;margin-top:1rem;text-align:center"><a href="login.html" style="color:var(--primary);font-weight:600">← Back to sign in</a></p>
</div></div>
<div id="toast"></div>
<script src="js/punjab.js"></script><script src="js/api.js"></script><script src="js/data.js"></script><script src="js/app.js"></script>
<script>
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault(); const f = e.target, m = document.getElementById('msg');
  if (!/^[6-9]\d{9}$/.test(f.phone.value.trim())) { m.style.color = 'var(--danger)'; m.textContent = 'Enter a valid 10-digit mobile number.'; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.value.trim())) { m.style.color = 'var(--danger)'; m.textContent = 'Enter a valid email address.'; return; }
  API.forgot(f.phone.value.trim(), f.email.value.trim()).then(r => { m.style.color = r.ok ? 'var(--primary)' : 'var(--danger)'; m.textContent = r.ok ? r.message : r.error; });
});
</script>
</body></html>
